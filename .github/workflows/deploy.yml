name: Deploy to Firebase Hosting

# 只有 push tag 才部署;一般推 master 不會觸發
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# 連續 push 多個 tag 時,避免兩個 deploy 互相覆蓋
concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本號取自 git tag,需完整歷史與 tag
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 預渲染(scripts/prerender.mjs)需要 puppeteer 的 Chromium;快取以加速 CI
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # 確保 Chromium 已安裝(已快取則為 no-op),避免 build 時預渲染失敗
      - name: Ensure Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        # 版本號取自最近的 git tag(3.1.0 → 顯示 3.1.0);容錯:tag 若帶 v 前綴會去掉
        run: |
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
          export APP_VERSION="${TAG#v}"
          echo "Building APP_VERSION=$APP_VERSION"
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESS_YEN }}
          projectId: jess-yen
          channelId: live
